<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Brújula 29N">

<title>Brújula 29N</title>
<style>
:root{--bg:#F2F2F4;--ink:#15131F;--mute:#6B6878;--acc:#FFA400;--acc2:#FFD15C;--accInk:#2B1A00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Inter","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:17px 24px;font-weight:800;font-size:17px;width:100%}
.link{color:var(--mute);font-size:14px;text-decoration:underline;padding:10px}
.dots{display:flex;justify-content:center;margin:0 0 18px}
.dots i{width:30px;height:30px;border-radius:50%;margin-left:-8px;border:2px solid var(--bg)}
.dots i:first-child{margin-left:0}
h1{font-size:64px;font-weight:900;letter-spacing:-2px;margin:0;line-height:1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#fff;border-radius:999px;padding:12px 16px;font-weight:700;font-size:15px}
.pill.on{background:var(--ink);color:#fff}
.bar{height:6px;background:#DCDCE2;border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--ink);transition:width .3s}
#stack{position:relative;flex:1;margin:14px 0 8px;min-height:0}
.card{position:absolute;inset:0;border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.12);will-change:transform}
.card .sec{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.card .t{font-size:27px;font-weight:900;line-height:1.18;margin:auto 0;letter-spacing:-.5px}
.card .lbl{font-size:14px;font-weight:700;opacity:.75}
.chip{position:absolute;top:22px;padding:8px 14px;border-radius:999px;font-weight:900;font-size:13px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
.legend{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--mute);padding:0 4px}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.star{background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}.star.on{background:var(--ink);color:#fff}
.hdr{border-radius:0 0 32px 32px;margin:0 -20px;padding:calc(env(safe-area-inset-top) + 16px) 22px 22px;background:var(--acc);color:var(--accInk)}
.hdr small{font-weight:900;letter-spacing:1.5px;font-size:11px;opacity:.75}
.hdr .big{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1.05}
.hdr .aff{font-weight:800;font-size:17px;cursor:pointer;display:inline-block;margin-top:6px}
.nav{display:flex;gap:6px;background:#fff;border-radius:999px;padding:6px;margin:10px 0 0;box-shadow:0 4px 18px rgba(0,0,0,.1)}
.nav button{flex:1;padding:12px;border-radius:999px;font-weight:800;font-size:15px;color:var(--mute)}
.nav button.on{background:var(--acc);color:var(--accInk)}
.news{background:#fff;border-radius:20px;padding:16px 16px 16px 20px;margin:0 0 12px;position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit}
.news:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc)}
.news b{display:block;font-size:17px;line-height:1.25;margin:4px 0 6px}.news p{margin:0 0 8px;font-size:14px;line-height:1.4;color:#4a4757}
.news span.m{font-size:12px;color:var(--mute);font-weight:700}
.new{background:var(--acc);color:var(--accInk);font-size:10px;font-weight:900;border-radius:6px;padding:2px 6px;margin-right:6px}
.card2{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.prow:last-child{border:0}
.sw{width:42px;height:42px;border-radius:50%;flex:none}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}.sheetbg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom) + 24px);max-height:82%;overflow-y:auto;color:var(--ink)}
.sheet h3{margin:0 0 10px;font-size:22px}.sheet p{line-height:1.45;font-size:15px;margin:8px 0}
.sheet .mi{display:block;width:100%;text-align:left;padding:15px 4px;font-weight:700;font-size:16px;border-bottom:1px solid #eee}
.h2{font-size:12px;font-weight:900;letter-spacing:1.2px;color:var(--mute);margin:16px 0 6px}
.ax{margin:14px 0}.ax .tr{height:10px;border-radius:5px;background:linear-gradient(90deg,#3DA9FF,#C9C9D6,#FF4D6D);position:relative}
.ax .tr i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translateX(-50%)}
.ax .l{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px;font-weight:700}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.orbit{flex:1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
</style></head><body><div id="app"></div><div class="sheetbg" id="sbg"><div class="sheet" id="sheet"></div></div>
<script>
const Q=[{"id": 0, "s": "gen", "lbl": "Desigualdad y Estado", "t": "El Estado debe corregir la desigualdad con impuestos y ayudas.", "p": null, "ax": "E", "d": -1, "c": {"q": "Esta pregunta mide cuánto papel das al Estado en la redistribución de la riqueza. Es una de las diferencias más estables entre izquierda y derecha.", "a": "Una desigualdad muy alta frena la movilidad social y la cohesión. Los impuestos progresivos financian servicios que igualan oportunidades, como la sanidad, la educación o las becas.", "e": "Una carga fiscal alta desincentiva trabajar, invertir y emprender. Lo importante es crear riqueza para todos, y el Estado no es el mejor gestor para lograrlo."}}, {"id": 1, "s": "gen", "lbl": "Responsabilidad individual", "t": "Cada uno es responsable de su éxito; el Estado debe intervenir lo mínimo.", "p": null, "ax": "E", "d": 1, "c": {"q": "Mide cuánto peso das al esfuerzo individual frente a las circunstancias de partida y al papel del Estado.", "a": "La libertad individual, la competencia y el mérito generan prosperidad. Un Estado muy presente desincentiva el esfuerzo y crea dependencia.", "e": "El punto de partida (familia, territorio, salud) condiciona mucho los resultados. Sin una red pública, la libertad real es muy desigual."}}, {"id": 2, "s": "gen", "lbl": "Tradición y cambio", "t": "Los cambios sociales rápidos suelen traer más problemas que beneficios.", "p": null, "ax": "S", "d": 1, "c": {"q": "Mide tu actitud ante el cambio social: conservar lo heredado o reformarlo.", "a": "Las costumbres e instituciones acumulan experiencia y dan estabilidad. Los cambios rápidos tienen consecuencias imprevistas.", "e": "Muchas normas tradicionales excluían a ciertos grupos. Casi todos los derechos actuales se lograron cuestionando lo establecido."}}, {"id": 3, "s": "gen", "lbl": "Autoridad y libertad", "t": "Una sociedad ordenada necesita autoridad firme, aunque limite algunas libertades.", "p": null, "ax": "L", "d": 1, "c": {"q": "Mide el equilibrio que prefieres entre orden y libertad.", "a": "Sin orden y respeto a las normas no hay seguridad ni convivencia. La autoridad debe poder hacerse respetar.", "e": "Las libertades individuales son la base de una democracia y el poder necesita límites. La mano dura puede derivar en abusos."}}, {"id": 4, "s": "viv", "lbl": "Tope al alquiler", "t": "Limitar por ley la subida del alquiler en las zonas más caras.", "p": [2, -2, -2, 2, 2, 2, -1, 2, 1, 2, null, -2], "ax": "E", "d": -1, "c": {"q": "La Ley de Vivienda de 2023 permite que las comunidades autónomas declaren «zonas tensionadas» y apliquen límites a los precios del alquiler en ellas. Cataluña fue la primera en hacerlo; otras comunidades han decidido no aplicarla.", "a": "Los alquileres han subido más que los salarios y muchas familias dedican una parte enorme de sus ingresos a la vivienda. Un límite da estabilidad a los inquilinos mientras se construye más.", "e": "Un tope puede reducir la oferta de alquiler (propietarios que venden o pasan al alquiler de temporada) y empeorar el mantenimiento. No resuelve la falta de vivienda y puede encarecer lo que queda fuera de la regulación.", "x": "El 2 de octubre de 2026 el Congreso rechazó dos decretos del Gobierno con medidas de vivienda, algo que precipitó el adelanto electoral. La evidencia internacional es matizada: algunos estudios encuentran precios más bajos en las viviendas reguladas, pero también menos oferta. Los primeros datos de Cataluña se interpretan de forma distinta según la fuente."}}, {"id": 5, "s": "viv", "lbl": "Liberalizar suelo", "t": "Para abaratar la vivienda hay que liberalizar suelo y quitar trámites.", "p": [0, 2, 2, -2, -2, -1, 1, -2, 0, -2, null, 2], "ax": "E", "d": 1, "c": {"q": "Hay bastante acuerdo en que falta oferta de vivienda, pero no en cómo aumentarla: con menos regulación para el sector privado o con más inversión pública.", "a": "La escasez de suelo urbanizable, la burocracia y los plazos de licencias encarecen y retrasan la construcción. Simplificarlos aumentaría la oferta y moderaría los precios.", "e": "Liberalizar suelo no garantiza que se construya vivienda asequible y puede alimentar la especulación y un urbanismo sin planificación. La burbuja de 2008 aconseja prudencia y más vivienda pública.", "x": "Según estimaciones del Banco de España, cada año se forman bastantes más hogares de los que se construyen viviendas. El urbanismo es competencia de las comunidades y los ayuntamientos, lo que explica diferencias grandes de plazos entre territorios."}}, {"id": 6, "s": "viv", "lbl": "Vivienda pública", "t": "El Estado debe construir un gran parque de vivienda pública de alquiler.", "p": [2, -1, -2, 2, 2, 2, 0, 2, 1, 2, null, -1], "ax": "E", "d": -1, "c": {"q": "Una parte de la crisis de la vivienda tiene que ver con que en España hay muy poca vivienda social en comparación con otros países europeos.", "a": "Un parque público estable de alquiler asequible reduce la presión sobre el mercado y da acceso a quien no puede pagar precios de mercado. Países como Austria o los Países Bajos lo hacen desde hace décadas.", "e": "Construir vivienda pública cuesta mucho dinero público y tarda años, y su gestión puede ser ineficiente. Sería más rápido incentivar al sector privado con colaboración público-privada o con ayudas al alquiler.", "x": "Las cifras que se citan habitualmente sitúan la vivienda social española en torno al 2,5 % del parque, frente a una media europea cercana al 9 %. Países Bajos, Austria o Dinamarca superan con holgura el 20 %."}}, {"id": 7, "s": "viv", "lbl": "Pisos turísticos e inversores", "t": "Limitar los pisos turísticos y la compra de vivienda por fondos y no residentes.", "p": [2, -1, -1, 2, 2, 2, null, 2, 1, 2, null, null], "ax": "E", "d": -1, "c": {"q": "Se debate cuánto influyen el alquiler turístico y la inversión institucional o extranjera en los precios, sobre todo en grandes ciudades, en la costa y en las islas.", "a": "Retiran viviendas del mercado residencial y suben los precios en barrios concretos. Las ciudades deberían poder priorizar el uso de las viviendas como hogar.", "e": "Los pisos turísticos son una parte pequeña del parque total y su efecto se concentra en zonas muy concretas. Limitar la propiedad y la inversión puede reducir la oferta, la actividad económica y el turismo.", "x": "Barcelona ha anunciado que retirará las licencias de pisos turísticos hacia 2028, y en 2025 el Gobierno planteó gravar con fuerza la compra por parte de extracomunitarios no residentes."}}, {"id": 8, "s": "viv", "lbl": "Impuestos a grandes rentas", "t": "Subir los impuestos a las rentas altas y a las grandes fortunas.", "p": [1, -2, -2, 2, 2, 2, -1, 2, null, 2, null, -2], "ax": "E", "d": -1, "c": {"q": "Se discute cuánto debe pagar cada nivel de renta y patrimonio, y si subir impuestos a quienes más tienen ayuda a financiar sanidad, educación o pensiones sin dañar la economía.", "a": "Quienes más tienen pueden aportar más sin perjudicar su nivel de vida, y España recauda algo menos que la media de la UE en relación con su PIB.", "e": "Subir impuestos a los más ricos puede llevarles a cambiar de residencia fiscal o a invertir menos. La recaudación adicional suele ser menor de lo previsto y, al final, la carga recae en las clases medias.", "x": "La presión fiscal de España ronda el 38 % del PIB, algo por debajo de la media de la UE (en torno al 40 %). Desde 2022 existe un impuesto estatal a las grandes fortunas, y el Impuesto sobre el Patrimonio varía mucho entre comunidades: Madrid lo bonifica al 100 %."}}, {"id": 9, "s": "viv", "lbl": "Bajar impuestos", "t": "Bajar impuestos estimula la economía y acaba beneficiando a todos.", "p": [-1, 2, 2, -2, -2, -1, 2, -2, null, -2, null, 2], "ax": "E", "d": 1, "c": {"q": "Es la idea central de la política de oferta: menos impuestos para que haya más inversión, empleo y consumo.", "a": "Hay más renta disponible y más incentivos para invertir y emprender. La competencia fiscal entre territorios atrae empresas y talento.", "e": "La bajada de impuestos reduce los ingresos públicos y puede obligar a recortar servicios o a aumentar la deuda. Sus beneficios suelen concentrarse en las rentas altas y su efecto sobre el crecimiento suele ser menor de lo prometido.", "x": "Las comunidades autónomas tienen capacidad para decidir sobre varios tributos, por lo que ya hay diferencias claras entre territorios."}}, {"id": 10, "s": "viv", "lbl": "Pensiones públicas", "t": "Las pensiones públicas deben mantenerse aunque haya que subir cotizaciones o impuestos.", "p": [2, 1, -1, 2, 2, 1, null, 2, 1, 2, null, null], "ax": "E", "d": -1, "c": {"q": "Las pensiones se pagan con las cotizaciones de quienes trabajan hoy (sistema de reparto). Con el envejecimiento hay menos trabajadores por jubilado, y se discute cómo asegurar su sostenibilidad.", "a": "Es un derecho que ha reducido mucho la pobreza entre los mayores. Más cotizaciones, impuestos o ingresos por empleo e inmigración permiten sostenerlo sin recortar prestaciones.", "e": "Con la demografía actual el gasto crecerá mucho. Convendría reforzar los planes privados o de empresa, ligar la pensión a los años cotizados y a la esperanza de vida, y no cargar más a los jóvenes.", "x": "Hay algo más de dos cotizantes por pensionista, cuando hace décadas había más de tres. Desde 2023 existe el Mecanismo de Equidad Intergeneracional, una cotización adicional para reforzar el sistema."}}, {"id": 11, "s": "viv", "lbl": "Sector privado en sanidad y educación", "t": "La sanidad y la educación funcionan mejor con más gestión privada.", "p": [-2, 2, 1, -2, -2, -1, 1, -2, 0, -2, null, 1], "ax": "E", "d": 1, "c": {"q": "En España conviven centros públicos, concertados (privados con financiación pública) y privados. Las comunidades autónomas gestionan la sanidad y la educación, y cada una combina esos modelos de forma distinta.", "a": "La colaboración privada puede reducir listas de espera, introducir competencia y dar libertad de elección a las familias.", "e": "Puede restar recursos a la red pública, segregar al alumnado o dar prioridad al beneficio frente al servicio universal. La evidencia sobre su eficiencia es mixta y depende de cada caso.", "x": "Las listas de espera sanitarias y la falta de profesionales son preocupaciones relevantes. El peso de la enseñanza concertada es mucho mayor en unas comunidades que en otras."}}, {"id": 12, "s": "ter", "lbl": "Referéndum en Cataluña", "t": "Cataluña debería poder votar un referéndum de independencia pactado con el Estado.", "p": [-2, -2, -2, 0, 1, 2, 2, 2, 0, 1, -1, -2], "ax": "T", "d": 1, "c": {"q": "La Constitución de 1978 establece la unidad de España (art. 2) y atribuye la soberanía al conjunto del pueblo español. El referéndum del 1 de octubre de 2017 fue declarado ilegal por el Tribunal Constitucional.", "a": "Una votación pactada, como la de Escocia en 2014 o las de Quebec, es una vía democrática para resolver el conflicto y medir el apoyo real. Negarla alimenta el problema.", "e": "La soberanía reside en todos los españoles y una parte no puede decidir por sí sola. Un referéndum dividiría a la sociedad catalana y sentaría un precedente para otros territorios.", "x": "Según el Centro de Estudios de Opinión (CEO), el apoyo a la independencia rozó el 49 % en 2017 y en los últimos años ronda el 40 %. Cambiar el artículo 2 exige el procedimiento de reforma agravado (art. 168): mayoría de dos tercios en ambas cámaras, elecciones y referéndum."}}, {"id": 13, "s": "ter", "lbl": "Indultos y amnistía", "t": "Los indultos y la amnistía han sido buenos para la convivencia en Cataluña.", "p": [2, -2, -2, 2, 2, 2, 2, 2, 2, 2, 1, -2], "ax": "T", "d": 1, "c": {"q": "En 2021 el Gobierno indultó a los líderes del procés condenados por el Tribunal Supremo, y en 2024 se aprobó una ley de amnistía para los hechos relacionados con el proceso independentista.", "a": "Rebajan la tensión, reabren el diálogo político y pasan página de una respuesta penal que se considera desproporcionada. Desde entonces el apoyo a la independencia ha bajado.", "e": "Se premia a quienes incumplieron la ley, se debilita la igualdad ante la ley y el Estado de derecho, y la amnistía se aprobó a cambio de apoyos parlamentarios para formar Gobierno. No garantiza que no haya nuevos desafíos.", "x": "El Tribunal Constitucional avaló en lo esencial la ley en 2025. Algunos aspectos de su aplicación, como la malversación, han sido objeto de disputa judicial, incluidas consultas al Tribunal de Justicia de la UE, y puede haber novedades posteriores."}}, {"id": 14, "s": "ter", "lbl": "Recentralizar competencias", "t": "Hay que devolver competencias, como sanidad o educación, de las comunidades al Estado.", "p": [-2, -1, 2, -2, -2, -2, -2, -2, -2, -2, -2, -1], "ax": "T", "d": -1, "c": {"q": "España es uno de los países más descentralizados de Europa: las comunidades gestionan sanidad, educación y servicios sociales, con una gran variedad de normas y servicios.", "a": "Evitaría duplicidades administrativas y desigualdades entre ciudadanos de distintas comunidades. Un Estado más unitario aseguraría los mismos derechos en todo el país y podría reducir costes.", "e": "La descentralización acerca las decisiones a los ciudadanos y permite adaptar las políticas a cada territorio. Recentralizar generaría conflicto y no garantiza una mejor gestión.", "x": "Las comunidades gestionan alrededor de un tercio del gasto público total, sobre todo en sanidad y educación."}}, {"id": 15, "s": "ter", "lbl": "Financiación autonómica", "t": "Las comunidades que más aportan deberían quedarse con más de lo que recaudan.", "p": [-1, -1, -2, -1, -1, 2, 2, 1, 2, 1, -1, null], "ax": "T", "d": 1, "c": {"q": "El sistema de financiación autonómica reparte recursos con criterios de solidaridad entre territorios. El País Vasco y Navarra tienen un régimen propio (concierto y convenio), y otras comunidades reclaman cambios en un modelo cuya reforma lleva años pendiente.", "a": "Las comunidades con más ingresos soportan una carga que consideran excesiva. Un modelo más ligado a lo que cada territorio recauda sería más transparente y haría más responsable a quien gasta.", "e": "La solidaridad entre territorios es un principio constitucional y garantiza servicios básicos similares en todo el país. Ese modelo favorecería a las comunidades más ricas y dejaría sin recursos a las más pobres.", "x": "Las llamadas «balanzas fiscales», que miden quién aporta y quién recibe, dependen mucho de la metodología que se use (flujo monetario o carga-beneficio), y no existe un dato único aceptado por todos."}}, {"id": 16, "s": "ter", "lbl": "Lenguas cooficiales en la escuela", "t": "La lengua propia debe ser la principal en la escuela de su territorio.", "p": [0, -2, -2, 1, 1, 2, 2, 2, 2, 2, null, -1], "ax": "T", "d": 1, "c": {"q": "En Cataluña, la «inmersión lingüística» usa el catalán como lengua vehicular en la escuela. En otras comunidades conviven modelos distintos, como los del País Vasco o Galicia.", "a": "Garantiza el conocimiento de la lengua propia y cohesiona a la sociedad, sin perjudicar el dominio del castellano, que se aprende igualmente.", "e": "Las familias deberían poder elegir la lengua de enseñanza y debe garantizarse el derecho a estudiar en castellano en todo el territorio.", "x": "Los tribunales han ordenado en varios casos que al menos un 25 % de las clases se imparta en castellano en Cataluña, y la aplicación de esas sentencias ha generado una disputa política y judicial."}}, {"id": 17, "s": "inm", "lbl": "Inmigración y pensiones", "t": "España necesita inmigración para sostener su economía y sus pensiones.", "p": [2, 1, -2, 2, 2, 2, 1, 2, 2, 2, 1, null], "ax": "I", "d": -1, "c": {"q": "La población española envejece y la natalidad es de las más bajas del mundo. Una parte creciente del empleo y de las cotizaciones procede de personas nacidas en el extranjero.", "a": "Sin inmigración la población activa caería y a la Seguridad Social le costaría más pagar las pensiones. Muchos sectores, como la agricultura, los cuidados, la hostelería o la construcción, dependen de ella.", "e": "La inmigración no resuelve por sí sola el envejecimiento y puede presionar salarios, vivienda y servicios. La prioridad debería ser aumentar la natalidad, la productividad y el empleo de quienes ya viven aquí.", "x": "La fecundidad en España ronda 1,1 hijos por mujer (el nivel de reemplazo es 2,1), y según el INE hay alrededor de siete millones de residentes con nacionalidad extranjera."}}, {"id": 18, "s": "inm", "lbl": "Fronteras y expulsiones", "t": "Endurecer el control de fronteras y acelerar las expulsiones de quienes están en situación irregular.", "p": [-1, 2, 2, -2, -2, -2, 1, -2, -1, -2, null, 2], "ax": "I", "d": 1, "c": {"q": "España es frontera sur de la UE: hay entradas por mar a Canarias y Baleares, y por tierra en Ceuta y Melilla. La política migratoria combina control, acuerdos con países de origen, protección internacional y regularización.", "a": "Un país debe decidir quién entra y garantizar que se cumplen las normas. Endurecer los controles y repatriar reduce la presión migratoria y las muertes en el mar.", "e": "Muchas expulsiones son inviables si el país de origen no acepta el retorno. El endurecimiento puede vulnerar derechos y el derecho de asilo, y lo que más ayuda es la cooperación con los países de origen y las vías legales.", "x": "Según el Ministerio del Interior, las llegadas a Canarias alcanzaron un récord en 2024 y bajaron mucho en 2025. La UE ha aprobado un Pacto de Migración y Asilo con nuevos procedimientos."}}, {"id": 19, "s": "inm", "lbl": "Regularización", "t": "Regularizar a los inmigrantes sin papeles que llevan años viviendo y trabajando aquí.", "p": [1, -1, -2, 2, 2, 2, null, 2, 1, 2, null, null], "ax": "I", "d": -1, "c": {"q": "Una iniciativa legislativa popular con más de 700.000 firmas pidió regularizar a unas 500.000 personas sin papeles, y el Congreso la admitió a trámite en 2024.", "a": "Quienes ya viven y trabajan aquí contribuyen y siguen sin derechos. Regularizarlos reduce la economía sumergida y la explotación laboral y aumenta las cotizaciones.", "e": "Puede generar efecto llamada y premiar la entrada irregular. Una regularización masiva no resuelve el problema de fondo, y sería mejor hacerlo caso por caso, con arraigo demostrado.", "x": "España ha hecho varias regularizaciones extraordinarias desde los años 80, la última masiva en 2005. Además, la figura del arraigo permite regularizar casos individuales tras años de residencia."}}, {"id": 20, "s": "inm", "lbl": "Reparto de menores migrantes", "t": "Repartir de forma obligatoria a los menores migrantes no acompañados entre las comunidades.", "p": [2, -1, -2, 2, 2, 1, null, 2, 2, 2, 2, null], "ax": "I", "d": -1, "c": {"q": "Canarias, Ceuta y Melilla acogen a muchos menores que llegan solos y sus servicios están sobrecargados. En 2025 se reformó la ley para repartirlos entre comunidades con criterios de capacidad.", "a": "Es una cuestión de solidaridad entre territorios y de protección de la infancia. Sin obligación, unas pocas comunidades soportan toda la carga.", "e": "La obligatoriedad invade competencias de las comunidades y puede generar efecto llamada. Defienden más financiación y más control de fronteras antes que un reparto forzoso.", "x": "Los menores migrantes quedan bajo la tutela de las comunidades autónomas. Varias comunidades han criticado o recurrido la reforma."}}, {"id": 21, "s": "inm", "lbl": "Prioridad en ayudas", "t": "Las ayudas y la vivienda pública deben priorizar a los españoles o a quienes llevan más años residiendo.", "p": [-2, 0, 2, -2, -2, -2, null, -2, -1, -2, null, null], "ax": "I", "d": 1, "c": {"q": "Se debate si los recursos públicos escasos, como la vivienda protegida o las ayudas, deberían asignarse con criterios de nacionalidad o de antigüedad de residencia. Algunos partidos lo defienden con la idea de «prioridad nacional».", "a": "Los recursos son limitados y quienes llevan más tiempo contribuyendo deberían tener prioridad. El vínculo con la comunidad importa.", "e": "La Constitución y el derecho europeo exigen igualdad de trato entre residentes legales. Los criterios por nacionalidad pueden ser discriminatorios, y los extranjeros residentes también cotizan y pagan impuestos.", "x": "Algunas comunidades ya exigen años de empadronamiento para ciertas ayudas, y esas exigencias han sido objeto de recursos judiciales. Varios estudios apuntan a un saldo fiscal neto positivo de la inmigración, aunque depende del perfil, la edad y el método de cálculo."}}, {"id": 22, "s": "inm", "lbl": "Diversidad cultural", "t": "La diversidad cultural y religiosa de los inmigrantes enriquece a España.", "p": [2, 0, -2, 2, 2, 2, 0, 2, 1, 2, null, null], "ax": "I", "d": -1, "c": {"q": "Es una pregunta sobre el modelo de integración: una cultura común a la que adaptarse (asimilación) o la convivencia de culturas diversas (interculturalidad).", "a": "La diversidad aporta ideas, economía y cultura, y España ya es una sociedad plural. La integración se logra con derechos, educación y convivencia, sin exigir renunciar a la propia identidad.", "e": "Una diversidad sin valores compartidos puede debilitar la cohesión y generar guetos. Conviene exigir integración (idioma, leyes, normas básicas) y poner límite a prácticas incompatibles con los derechos.", "x": "La Constitución garantiza la libertad ideológica, religiosa y de culto (art. 16) y, a la vez, establece que ninguna confesión tendrá carácter estatal."}}, {"id": 23, "s": "jus", "lbl": "Endurecer penas", "t": "Endurecer las penas de cárcel, incluida la prisión permanente revisable.", "p": [-1, 2, 2, -2, -2, -2, 1, -2, -1, -2, null, 2], "ax": "L", "d": 1, "c": {"q": "La prisión permanente revisable se introdujo en 2015 para los delitos más graves, y el Tribunal Constitucional avaló su constitucionalidad en 2021. Se debate si endurecer las penas reduce el delito.", "a": "Protege a la sociedad de delincuentes peligrosos, da una respuesta proporcionada a los crímenes más graves y refuerza el efecto disuasorio.", "e": "Los estudios criminológicos indican que la certeza de ser capturado disuade más que la dureza de la pena. Además, la cárcel de duración indefinida choca con la reinserción que busca la Constitución (art. 25).", "x": "España tiene una de las tasas de homicidios más bajas de la UE. La pena máxima de cárcel puede llegar a 40 años en casos de varios delitos graves."}}, {"id": 24, "s": "jus", "lbl": "Ocupación y desalojos", "t": "Desalojar rápido a los okupas, aunque no tengan otra alternativa de vivienda.", "p": [-1, 2, 2, -2, -2, -1, 2, -2, null, -2, null, 2], "ax": "L", "d": 1, "c": {"q": "Hay que distinguir entre la ocupación de viviendas vacías y los casos de personas que dejan de pagar el alquiler, que siguen procedimientos distintos.", "a": "La propiedad privada debe protegerse. Los procesos lentos dejan sin su vivienda a propietarios, incluidos pequeños propietarios, y generan inseguridad y problemas en las comunidades de vecinos.", "e": "Los desalojos sin alternativa pueden dejar en la calle a familias vulnerables. Los casos de ocupación son una parte pequeña del parque de viviendas, y la respuesta debería combinar la protección de los propietarios con más vivienda social.", "x": "Según Interior, las denuncias por ocupación están en torno a las 15.000-17.000 al año. Una reforma de 2018 permite el desalojo rápido de viviendas ocupadas de personas físicas, y se han planteado reformas posteriores para acelerar aún más los procedimientos."}}, {"id": 25, "s": "jus", "lbl": "Regular las drogas", "t": "Regular y despenalizar el cannabis en lugar de perseguirlo.", "p": [null, -2, -2, 2, 2, 2, null, 2, null, null, null, -2], "ax": "L", "d": -1, "c": {"q": "En España el consumo privado no es delito, pero la tenencia o el consumo en la calle se sanciona con multa y el tráfico sí es delito. Se discute si regular el cannabis reduce o aumenta los daños.", "a": "Regular desactiva el mercado criminal, permite controlar la calidad y el acceso de menores, y libera recursos policiales.", "e": "Normalizar el consumo puede aumentar su uso y los problemas de salud, sobre todo entre jóvenes. La experiencia de los países que han legalizado es mixta.", "x": "Portugal despenalizó la tenencia de pequeñas cantidades de todas las drogas en 2001, Canadá y Uruguay legalizaron el cannabis en 2018, y Alemania lo legalizó en parte en 2024."}}, {"id": 26, "s": "jus", "lbl": "Libertad de expresión", "t": "Reducir los delitos de opinión, como las injurias a la Corona o la ofensa a sentimientos religiosos.", "p": [null, -2, -2, 2, 2, 2, 1, 2, 1, 2, null, -2], "ax": "L", "d": -1, "c": {"q": "El Código Penal sanciona ciertos discursos: odio, injurias a la Corona, ofensas a sentimientos religiosos y enaltecimiento del terrorismo. Se debate si esos límites protegen derechos o restringen la libertad de expresión.", "a": "En democracia, las ideas, incluso las ofensivas, deben combatirse con más debate y no con sanciones penales. Ha habido artistas y usuarios de redes condenados por canciones o mensajes.", "e": "Los límites protegen a las minorías y al orden democrático, porque los discursos de odio pueden derivar en violencia, y existen en la mayoría de las democracias europeas. La ofensa gratuita no forma parte de la libertad de expresión.", "x": "En 2018 el Tribunal Europeo de Derechos Humanos condenó a España por sancionar la quema de fotografías de los Reyes (caso Stern Taulats y Roura Capellera)."}}, {"id": 27, "s": "val", "lbl": "Eutanasia", "t": "La eutanasia debe estar permitida para enfermos graves e incurables que la soliciten.", "p": [2, -1, -2, 2, 2, 2, null, 2, 2, 2, null, -2], "ax": "S", "d": -1, "c": {"q": "Desde 2021 una ley orgánica regula la eutanasia en España, bajo supervisión médica y con garantías, para personas con enfermedades graves e incurables o con padecimientos crónicos e invalidantes.", "a": "Respeta la autonomía y la dignidad de la persona ante un sufrimiento insoportable, con control médico y legal.", "e": "Puede presionar a personas vulnerables y desplazar los cuidados paliativos. La vida debe protegerse y la prioridad debería ser que todos tengan acceso a buenos cuidados paliativos.", "x": "España la regula de forma similar a otros países como los Países Bajos o Bélgica. El acceso a cuidados paliativos varía mucho entre comunidades."}}, {"id": 28, "s": "val", "lbl": "Restringir el aborto", "t": "El aborto debería estar más restringido de lo que está hoy.", "p": [-2, 0, 2, -2, -2, -2, -1, -2, -2, -2, null, null], "ax": "S", "d": 1, "c": {"q": "Desde 2010 el aborto es libre hasta la semana 14, con supuestos específicos hasta la 22 si hay riesgo grave. El Tribunal Constitucional avaló la ley en 2023, y el Gobierno ha planteado incluir el derecho al aborto en la Constitución.", "a": "Se propone proteger la vida del no nacido y que el aborto sea una excepción, con más información, asesoramiento y alternativas para la mujer.", "e": "Se sostiene que decidir sobre el propio cuerpo es un derecho de la mujer y que restringirlo no reduce los abortos, sino que los hace menos seguros. El sistema actual da garantías y plazos claros.", "x": "En 2023 se reformó la ley para garantizar el acceso en la sanidad pública y regular el registro de objetores de conciencia."}}, {"id": 29, "s": "val", "lbl": "Ley trans", "t": "Se debe poder cambiar el sexo en el registro por simple declaración, sin informes médicos.", "p": [1, -2, -2, 2, 2, 2, null, 2, 1, 2, null, -2], "ax": "S", "d": -1, "c": {"q": "La Ley 4/2023, conocida como «ley trans», permite cambiar el sexo registral por simple declaración a partir de los 16 años, con requisitos adicionales entre los 12 y los 16, y sin informes médicos ni tratamientos previos.", "a": "Reconoce la identidad de la persona sin patologizarla y reduce la discriminación y el sufrimiento. Otros países europeos, como Dinamarca o Irlanda, ya aplican la autodeterminación.", "e": "Preocupan los menores, por la dificultad de revertir ciertas decisiones, los espacios o competiciones deportivas reservados a mujeres y la fiabilidad de las estadísticas. Algunos sectores del feminismo y de la comunidad médica piden más cautelas.", "x": "La ley también prohíbe las terapias de conversión."}}, {"id": 30, "s": "val", "lbl": "República", "t": "España debería ser una república, con un jefe del Estado elegido por la ciudadanía.", "p": [-2, -2, -2, 1, 2, 2, 1, 2, null, 2, null, -2], "ax": "S", "d": -1, "c": {"q": "La Constitución de 1978 establece una monarquía parlamentaria: el Rey es jefe del Estado con funciones simbólicas y de arbitraje, y no gobierna. Cambiar la forma de Estado exige el procedimiento de reforma más exigente (art. 168).", "a": "Un jefe del Estado debería ser elegido y no heredar el cargo. El principio de igualdad choca con la herencia, y un presidente elegido daría más transparencia y rendición de cuentas.", "e": "La Monarquía parlamentaria simboliza la unidad y la continuidad del Estado y ha dado estabilidad desde la Transición. Elegir a un presidente politizaría la jefatura del Estado, y el cambio sería arriesgado sin una necesidad clara.", "x": "Las encuestas muestran más apoyo a la monarquía entre los mayores y menos entre los jóvenes. Reformar el título II de la Constitución requiere dos tercios de ambas cámaras, elecciones y referéndum."}}, {"id": 31, "s": "val", "lbl": "Memoria histórica", "t": "El Estado debe impulsar políticas activas de memoria histórica.", "p": [2, -2, -2, 2, 2, 2, 1, 2, 2, 2, null, -2], "ax": "S", "d": -1, "c": {"q": "La Ley de Memoria Democrática de 2022 amplió la Ley de Memoria Histórica de 2007 con exhumaciones de fosas, retirada de simbología y cambios en el Valle de Cuelgamuros.", "a": "Es una deuda con las víctimas de la Guerra Civil y la dictadura, una forma de reparar a las familias y de consolidar los valores democráticos.", "e": "Reabre heridas y divide en lugar de unir. Convendría centrarse en el espíritu de reconciliación de la Transición, y la historia deberían estudiarla los historiadores y no el legislador.", "x": "Se han catalogado más de 2.000 fosas comunes, y la Ley de Amnistía de 1977 ha impedido hasta ahora procesos penales por crímenes del franquismo."}}, {"id": 32, "s": "val", "lbl": "Tauromaquia y tradiciones", "t": "Los toros y otras tradiciones populares deben protegerse como patrimonio cultural.", "p": [null, 2, 2, -2, -2, -2, null, -2, null, null, null, 2], "ax": "S", "d": 1, "c": {"q": "Desde 2013 la tauromaquia está protegida como patrimonio cultural por una ley estatal. Cataluña prohibió las corridas en 2010, y el Tribunal Constitucional anuló esa prohibición en 2016 por razones de competencias.", "a": "Son tradiciones con siglos de historia que generan empleo y actividad en el mundo rural. La cultura popular debe protegerse sin imponer juicios morales ajenos.", "e": "Implican sufrimiento animal y no deberían financiarse con dinero público. La sensibilidad social cambia, y la tradición no justifica el maltrato.", "x": "Varias comunidades y ayuntamientos han retirado ayudas a espectáculos taurinos, mientras otros las mantienen."}}, {"id": 33, "s": "ene", "lbl": "Energía nuclear", "t": "España debería mantener abiertas sus centrales nucleares más allá del calendario de cierre previsto.", "p": [-1, 2, 2, -2, -2, -1, null, -2, null, -2, null, null], "ax": null, "d": 0, "c": {"q": "El calendario pactado en 2019 prevé cerrar las siete centrales nucleares españolas entre 2027 y 2035. Se discute si ampliar su vida útil. El apagón de abril de 2025 reavivó el debate sobre la seguridad del suministro.", "a": "Producen electricidad estable y sin emisiones de CO2, ayudan a abaratar el sistema y dan seguridad de suministro mientras crecen las renovables.", "e": "Cerrarlas libera inversión para renovables y almacenamiento, evita riesgos y residuos radiactivos, y mantenerlas exige costosas inversiones. Las renovables ya cubren buena parte de la demanda.", "x": "El calendario contempla el cierre escalonado de Almaraz, Ascó, Cofrentes, Vandellós II y Trillo. Cualquier prórroga requiere el informe del Consejo de Seguridad Nuclear."}}, {"id": 34, "s": "ene", "lbl": "Gasto en defensa", "t": "España debería aumentar de forma notable su gasto en defensa.", "p": [0, 2, 1, -2, -2, -2, null, -2, null, -2, null, 2], "ax": null, "d": 0, "c": {"q": "En 2025 la OTAN fijó un objetivo de gasto en defensa del 5 % del PIB para 2035. España negoció cumplirlo con un nivel menor, en torno al 2 %, y el debate sigue abierto.", "a": "Con la guerra en Ucrania y la incertidumbre sobre el papel de EE. UU., Europa debe reforzar su defensa. Cumplir con los aliados y proteger la soberanía exige más inversión.", "e": "El gasto militar resta recursos a sanidad, vivienda o educación. La seguridad también se construye con diplomacia y cooperación, y conviene definir antes una estrategia europea común."}}],BAND={"E": {"tag": ["Intervencionista", "Redistributivo", "Economía pragmática", "Favorable al mercado", "Liberal en economía"], "txt": ["Defiendes un Estado fuerte en la economía: servicios públicos amplios, impuestos progresivos y regulación del mercado, también en la vivienda.", "Prefieres que el Estado redistribuya y regule, con servicios públicos sólidos, sin romper con la economía de mercado.", "En economía mezclas medidas de intervención y de mercado según el problema, sin una doctrina fija.", "Confías más en el mercado y en la iniciativa privada que en el Estado, con impuestos moderados y regulación limitada.", "Defiendes con claridad la libertad económica: impuestos bajos, poco Estado y más peso del sector privado en los servicios."]}, "S": {"tag": ["Muy progresista", "Progresista", "Moderado en valores", "Conservador en valores", "Muy tradicional"], "txt": ["En valores eres decididamente progresista: apoyas ampliar derechos y cuestionar normas e instituciones heredadas.", "En valores sociales te inclinas por el cambio y por ampliar derechos.", "En valores sociales eres moderado: aceptas cambios en unos asuntos y valoras la tradición en otros.", "En valores te inclinas por la tradición, la continuidad de las instituciones y los referentes culturales heredados.", "En valores eres claramente tradicional: defiendes conservar costumbres, instituciones y símbolos heredados."]}, "L": {"tag": ["Garantista", "Pro libertades", "Equilibrado en seguridad", "Pro seguridad", "Mano dura"], "txt": ["En libertades y justicia eres claramente garantista: privacidad, libertad de expresión y derechos de los acusados por delante de la mano dura.", "Te inclinas por las libertades individuales y las garantías frente al endurecimiento penal o policial.", "En seguridad y libertades buscas un equilibrio entre las garantías individuales y la protección de la sociedad.", "Te inclinas por una respuesta más firme en seguridad y orden público, con penas más duras y más medios policiales.", "Priorizas con claridad el orden y la autoridad: penas duras, seguridad y respeto a la norma por encima de otras consideraciones."]}, "I": {"tag": ["Muy abierto a la inmigración", "Abierto a la inmigración", "Inmigración regulada", "Restrictivo", "Muy restrictivo"], "txt": ["Ante la inmigración defiendes una política muy abierta: más vías legales, regularización y refuerzo del asilo y la integración.", "En inmigración te inclinas por la apertura y la integración, y la ves como una oportunidad económica y demográfica.", "En inmigración defiendes una política equilibrada: reconoces su necesidad económica y también la importancia del control y la integración.", "En inmigración te inclinas por más control y por condiciones más exigentes de entrada, acceso a ayudas e integración.", "En inmigración defiendes una política claramente restrictiva: control estricto de fronteras, más expulsiones y prioridad para los nacionales."]}, "T": {"tag": ["Centralista", "Pro Estado unitario", "Autonomista", "Pro autogobierno", "Soberanista"], "txt": ["En lo territorial defie  <div class="bar"><div style="width:${S.index/Q.length*100}%"></div></div>
 <div id="stack"><div class="card" id="cd" style="background:linear-gradient(160deg,${c1},${c2});color:${ink}">
  <div class="sec">${sn}</div><div class="t">${esc(q.t)}</div><div class="lbl">${esc(q.lbl)}</div>
  <div class="chip" id="ch"></div></div></div>
 <div class="legend"><span>← en desacuerdo</span><span>↓ no lo sé</span><span>de acuerdo →</span></div>
 <div class="row" style="margin-top:10px"><button class="star ${S.star.includes(q.id)?"on":""}" id="st">★ Me importa</button><button class="star" id="nl">No lo sé</button><button class="star" id="in">Más info</button></div></div>`;
 $("#bk").onclick=()=>{if(S.index>0){S.index--;save();rQuiz()}};$("#sk").onclick=()=>answer(SKIP);$("#nl").onclick=()=>answer(0);
 $("#st").onclick=()=>{const i=S.star.indexOf(q.id);i<0?S.star.push(q.id):S.star.splice(i,1);save();$("#st").classList.toggle("on")};
 $("#in").onclick=()=>sheet(`<h3>${esc(q.lbl)}</h3><p>${esc(feed.facts&&feed.facts[q.id]||q.c.q)}</p><div class="h2">A FAVOR</div><p>${esc(q.c.a)}</p><div class="h2">EN CONTRA</div><p>${esc(q.c.e)}</p>`);
 const cd=$("#cd"),ch=$("#ch");let sx=0,sy=0,dx=0,dy=0,drag=false;
 const LAB=[[ "MUY DE ACUERDO ✓✓",2],["DE ACUERDO ✓",1],["NO LO SÉ —",0],["EN DESACUERDO ✕",-1],["MUY EN DESACUERDO ✕✕",-2]];
 function pick(){const W=cd.offsetWidth;if(dy>W*.25&&Math.abs(dx)<W*.2)return 0;if(dx>W*.30)return 2;if(dx>W*.11)return 1;if(dx<-W*.30)return -2;if(dx<-W*.11)return -1;return null}
 cd.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;cd.setPointerCapture(e.pointerId);cd.style.transition="none"};
 cd.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;dy=Math.max(0,e.clientY-sy);cd.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
  const v=pick();if(v==null){ch.style.opacity=0}else{ch.textContent=LAB.find(l=>l[1]==v)[0];ch.style.opacity=1;ch.style.left=dx>0?"20px":"auto";ch.style.right=dx>0?"auto":"20px"}};
 const end=()=>{if(!drag)return;drag=false;const v=pick();if(v==null){cd.style.transition="transform .25s";cd.style.transform="";ch.style.opacity=0;dx=dy=0;return}
  cd.style.transition="transform .22s,opacity .22s";cd.style.transform=`translate(${v==0?0:(dx>0?1:-1)*700}px,${v==0?700:dy}px) rotate(${dx/10}deg)`;cd.style.opacity=0;setTimeout(()=>answer(v),200)};
 cd.onpointerup=end;cd.onpointercancel=end}
function rCalc(){app.innerHTML=`<div class="scr"><div class="orbit fade">Calculando tu brújula…</div></div>`;
 setTimeout(()=>{const m=matches().find(x=>x.score!=null);S.last=m?m.party.id:null;S.done=true;S.tab=0;save();go("result")},1200)}
/* RESULT */
function rResult(){const ms=matches(),top=ms.find(x=>x.score!=null),p=top?top.party:P(S.last)||PARTIES[0];
 if(p){S.last=p.id;setAccent(p.c1,p.c2,p.ink)}
 const body=[tHome,tParties,tProfile][S.tab](ms,p,top);
 app.innerHTML=`<div class="scr" style="padding-top:0"><div class="scroll fade" style="flex:1;margin:0 -20px;padding:0 20px 12px">${body}</div>
 <div class="nav">${["Inicio","Partidos","Perfil"].map((t,i)=>`<button class="${S.tab==i?"on":""}" data-t="${i}">${t}</button>`).join("")}</div></div>`;
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=+b.dataset.t;save();rResult()});
 bind()}
function bind(){const a=$("#aff"),m=$("#more"),r=$("#rf");if(a)a.onclick=()=>why(a.dataset.p);if(m)m.onclick=moreSheet;if(r)r.onclick=()=>loadFeed(true);
 app.querySelectorAll("[data-only]").forEach(b=>b.onclick=()=>{S.only=+b.dataset.only;save();rResult()});
 app.querySelectorAll("[data-why]").forEach(b=>b.onclick=()=>why(b.dataset.why));
 app.querySelectorAll("[data-ax]").forEach(b=>b.onclick=()=>axSheet(b.dataset.ax));
 const sw=$("#sw");if(sw)sw.onclick=()=>{S.showAll=!S.showAll;save();rResult()}}
function chip(l,on,i){return `<button data-only="${i}" style="padding:10px 18px;border-radius:999px;font-weight:800;background:${on?"var(--accInk)":"rgba(255,255,255,.55)"};color:${on?"var(--acc)":"var(--accInk)"}">${l}</button>`}
function tHome(ms,p,top){const items=S.only==0?feed.news.filter(n=>n.party==p.id):feed.news.filter(n=>n.party=="all");items.sort((a,b)=>b.date.localeCompare(a.date));
 const fresh=n=>{try{return new Date(n.date)>=new Date(new Date(feed.updated)-864e5)}catch(e){return false}};
 return `<div class="hdr" style="margin:0 -20px 16px"><div class="row" style="justify-content:space-between"><small>TU PARTIDO</small><span><button id="rf" style="font-weight:800;padding:6px 10px">↻</button><button id="more" style="font-weight:900;padding:6px 10px;font-size:20px">⋮</button></span></div>
 <div class="big">${esc(p.n)}</div><div style="font-weight:700;opacity:.8">${esc(p.full)}</div>
 ${top?`<span class="aff" id="aff" data-p="${p.id}">${top.score}% de afinidad ›</span>`:""}
 <div style="font-weight:700;margin-top:10px;opacity:.85">${daysTxt(days())}</div>
 <div class="row" style="justify-content:flex-start;margin-top:14px">${chip("Noticias",S.only==0,0)}${chip("Campaña",S.only==1,1)}</div></div>
 ${feed.banner?`<p style="font-size:12px;color:var(--mute);padding:0 4px">${esc(feed.banner)}</p>`:""}
 ${items.length?items.map(n=>`<a class="news" href="${esc(n.url)}" target="_blank" rel="noopener"><span class="m">${fresh(n)?'<span class="new">NUEVO</span>':""}${esc(n.topic)} · ${esc(n.date)}</span><b>${esc(n.title)}</b><p>${esc(n.summary)}</p><span class="m">${esc(n.source)} ↗</span></a>`).join(""):`<p style="color:var(--mute);padding:20px 4px">Aún no hay noticias aquí. Se actualizan a diario.</p>`}`}
function tParties(ms){const here=ms.filter(m=>m.score!=null),oth=PARTIES.filter(x=>!ms.find(m=>m.party==x));
 return `<h2 style="font-size:28px;margin:calc(env(safe-area-inset-top) + 18px) 0 10px">Tu afinidad</h2><div class="card2">${ms.map(m=>`<div class="prow" data-why="${m.party.id}"><div class="sw" style="background:${m.party.c1}"></div><div style="flex:1"><b>${esc(m.party.n)}</b>${m.score==null?'<div style="font-size:12px;color:var(--mute)">Pocos datos</div>':""}${m.score!=null&&m.shared<12?'<div style="font-size:12px;color:var(--mute)">Resultado parcial</div>':""}</div><b style="font-size:20px">${m.score==null?"—":m.score+"%"}</b></div>`).join("")}</div>
 ${oth.length?`<p style="font-size:13px;color:var(--mute);line-height:1.4">${S.showAll?"Se cuentan también partidos de otras comunidades.":"No se presentan en tu comunidad: "+oth.map(x=>x.n).join(", ")+"."}</p><button class="pill" id="sw">${S.showAll?"Quitar los partidos de otras comunidades":"Contarlos en mi ranking"}</button>`:""}`}
function tProfile(){const r=profile(),fr=famRank(r.sc);
 return `<div style="padding-top:calc(env(safe-area-inset-top) + 18px)"><small style="font-weight:900;letter-spacing:1.5px;color:var(--mute)">TU PERFIL</small><div style="font-size:38px;font-weight:900;letter-spacing:-1px">${r.label}</div><div style="color:var(--mute);font-weight:700">${r.pos.toFixed(1).replace(".",",")} de 10 en la escala izquierda–derecha</div>
 <div class="card2" style="margin-top:14px">${AXO.map(a=>{const v=r.sc[a];return `<div class="ax" data-ax="${a}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${AX[a].name}</b><span style="font-weight:800;text-align:right">${v==null?"—":BAND[a].tag[bandIdx(v)]+" ("+sgn(v)+")"}</span></div><div class="tr" style="margin-top:8px">${v==null?"":`<i style="left:${(v+100)/2}%"></i>`}</div><div class="l"><span>${AX[a].lo}</span><span>${AX[a].hi}</span></div></div>`}).join("")}</div>
 <div class="card2"><div class="h2" style="margin-top:0">FAMILIA IDEOLÓGICA MÁS CERCANA</div><b style="font-size:20px">${esc(fr[0].f.n)}</b> <span style="color:var(--mute)">${fr[0].sim}%</span><p style="font-size:14px">${esc(fr[0].f.d)}</p>
 ${fr.slice(1,3).map(x=>`<div style="color:var(--mute);font-size:14px">${esc(x.f.n)} · ${x.sim}%</div>`).join("")}</div></div>`}
/* SHEETS */
function sheet(h){$("#sheet").innerHTML=h;$("#sbg").classList.add("on")}
$("#sbg").onclick=e=>{if(e.target.id=="sbg")$("#sbg").classList.remove("on")};
function why(id){const m=matchAll(true).find(x=>x.party.id==id);if(!m)return;const pa=m.party;
 const row=(it,ok)=>`<p><b>${esc(it.q.lbl)}</b><br><span style="color:var(--mute);font-size:13px">Tú: ${["Muy en desacuerdo","En desacuerdo","Neutral","De acuerdo","Muy de acuerdo"][it.a+2]} · ${esc(pa.n)}: ${it.p>1?"A favor":it.p>0?"Más bien a favor":it.p<-1?"En contra":"Más bien en contra"}</span></p>`;
 sheet(`<h3 style="color:${pa.c1}">${esc(pa.n)} ${m.score==null?"":m.score+"%"}</h3><p style="color:var(--mute)">${esc(pa.full)}${m.shared<12?" · resultado parcial ("+m.shared+" temas)":""}</p>
 ${m.ag.length?`<div class="h2">DONDE COINCIDÍS</div>${m.ag.slice(0,4).map(i=>row(i,1)).join("")}`:""}${m.dis.length?`<div class="h2">DONDE DISCREPÁIS</div>${m.dis.slice(0,4).map(i=>row(i,0)).join("")}`:""}
 <button class="btn" style="margin-top:14px;background:${pa.c1};color:${pa.ink}" id="mk">Usar sus colores</button>`);
 $("#mk").onclick=()=>{S.last=id;save();$("#sbg").classList.remove("on");rResult()}}
function axSheet(a){const r=profile(),v=r.sc[a];sheet(`<h3>${AX[a].name}</h3><p><b>${v==null?"Sin datos":BAND[a].tag[bandIdx(v)]}</b></p><p>${v==null?"":esc(BAND[a].txt[bandIdx(v)])}</p>`)}
function moreSheet(){sheet(`<button class="mi" id="m1">Compartir mi resultado</button><button class="mi" id="m2">Cambiar de comunidad</button><button class="mi" id="m3">Repasar mis respuestas</button><button class="mi" id="m4">Cómo funciona</button><button class="mi" id="m5">Repetir el test</button>`);
 $("#m1").onclick=()=>{const r=profile(),t=matches().filter(x=>x.score!=null).slice(0,3).map(x=>x.party.n+" "+x.score+"%").join(", ");const txt=`Brújula 29N · mi resultado\nPerfil: ${r.label}\nMayor afinidad: ${t}`;if(navigator.share)navigator.share({text:txt});else navigator.clipboard&&navigator.clipboard.writeText(txt)};
 $("#m2").onclick=()=>{$("#sbg").classList.remove("on");go("region")};
 $("#m3").onclick=()=>{$("#sbg").classList.remove("on");S.index=0;S.done=false;go("quiz")};
 $("#m4").onclick=()=>sheet(`<h3>Cómo funciona</h3><p>Cada respuesta se compara con la posición de cada partido en ese tema (programas, votaciones y declaraciones). Cuanto más cerca, más afinidad. «Me importa» pesa el doble.</p><p>Hace falta compartir al menos 5 temas para mostrar un porcentaje. Es una orientación, no una recomendación de voto. Las posiciones se revisan durante la campaña.</p>`);
 $("#m5").onclick=()=>{if(confirm("¿Repetir el test desde cero?")){S={ans:{},star:[],region:S.region,index:0,done:false,tab:0,only:0,showAll:S.showAll,screen:"quiz",last:null};save();$("#sbg").classList.remove("on");render()}}}
async function loadFeed(){try{const r=await fetch(FEED_URL+"?t="+Date.now());if(!r.ok)return;const j=await r.json();if(j&&Array.isArray(j.news)){feed=j;localStorage.setItem("b29feed",JSON.stringify(j));if(S.screen=="result")rResult()}}catch(e){}}
render();loadFeed();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
